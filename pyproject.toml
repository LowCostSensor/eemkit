[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eemkit"
dynamic = ["version"]
description = "Excitation-emission matrix (EEM) processing and PARAFAC modelling of dissolved organic matter fluorescence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "scipy>=1.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
gui = ["matplotlib>=3.8", "PySide6>=6.6"]
dev = ["pytest>=7", "pytest-cov", "pytest-qt", "ruff", "tensorly", "matplotlib>=3.8",
       "PySide6>=6.6"]  # tensorly: independent cross-check

[project.gui-scripts]
eemkit-gui = "eemkit.gui:main"

[tool.hatch.version]
path = "src/eemkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eemkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: needs the real dataset; set EEMKIT_TEST_DATA to its root folder",
]
filterwarnings = ["error::eemkit.errors.EEMKitWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
