name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: pip install -e ".[dev]"
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --cov=eemkit --cov-report=term 2>&1 | tee pytest.log
      - name: Show failures as annotations (readable without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)|^E   |Error:|INTERNALERROR" pytest.log | head -n 9 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          tail -n 1 pytest.log | while IFS= read -r line; do echo "::error::${line}"; done
